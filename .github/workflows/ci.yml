name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  wasm:
    name: WebAssembly interpreter verification
    uses: ./.github/workflows/wasm-verify.yml
    permissions:
      contents: read

  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cc -O2 -Wall -DSPROUT_SQLITE -o src/sprout src/sprout.c src/vendor/sqlite/sqlite3.c -lm -pthread -ldl

      - name: Build (Windows, MinGW)
        if: runner.os == 'Windows'
        run: gcc -O2 -Wall -s -DSPROUT_SQLITE -Wl,--stack,67108864 -o src/sprout.exe src/sprout.c src/vendor/sqlite/sqlite3.c -lm -lurlmon

      - name: Export native worker path
        # Python produces a native absolute Windows path rather than MSYS /d/... paths.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          binary = (Path.cwd() / 'src' / ('sprout.exe' if os.name == 'nt' else 'sprout')).resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SPROUT_BINARY={binary}\nSPROUT_COMMAND={binary}\n')
          PY

      - name: Version smoke test
        run: |
          bin=src/sprout; [ -f src/sprout.exe ] && bin=src/sprout.exe
          "$bin" version

      - name: Build and smoke-test Windows installation
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\installer\build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\install.ps1 -InstallDir "$env:RUNNER_TEMP\sprout-install" -NoPath

      - name: Run test suite
        run: bash src/tests/run.sh

      - name: CLI regression tests
        run: |
          bin=src/sprout; [ -f src/sprout.exe ] && bin=src/sprout.exe
          python src/tests/cli_test.py "$bin"
          python src/tests/unicode_boundary_test.py "$bin"

      - name: Editor and playground regression tests
        run: |
          node --test vscode-extension/tests/*.test.js playground/tests/*.test.js integrations/node/tests/*.test.js examples/apps/*.test.js examples/adoption/totalreach/parity.test.js examples/adoption/order-quote/parity.test.js

      - name: Measurement tool contracts (no measured workload)
        timeout-minutes: 2
        run: |
          python src/tests/measurement_tool_test.py
          python src/tests/measurement_input_bound_test.py
          python src/tests/measurement_inventory_growth_test.py

      - name: Native production foundation contracts
        run: |
          bin="$SPROUT_BINARY"
          compiler=cc; if [ "$RUNNER_OS" = "Windows" ]; then compiler=gcc; fi
          export SPROUT_GC_ROOT_CC="$compiler"
          export SPROUT_ARGUMENT_BUFFER_CC="$compiler"
          export SPROUT_CAPABILITIES_CC="$compiler"
          python src/tests/gc_env_roots_test.py "$bin"
          python src/tests/argument_buffers_test.py "$bin"
          python src/tests/runtime_capabilities_test.py "$bin"
          python src/tests/stdlib_production_test.py "$bin"
          python src/tests/distribution_test.py "$bin"
          python src/tests/security_boundary_test.py "$bin"
          python src/tests/serialization_test.py "$bin"
          python src/tests/store_publication_test.py "$bin"
          python src/tests/store_read_fault_test.py
          python src/tests/runtime_production_test.py "$bin"
          python src/tests/sqlite_migrations_test.py "$bin"
          python src/tests/workflow_tools_test.py "$bin"
          python src/tests/cli_library_test.py "$bin"
          python src/tests/validation_library_test.py "$bin"
          python src/tests/intrinsic_builtin_test.py "$bin"
          python src/tests/csv_import_example_test.py "$bin"
          python src/tests/config_library_test.py "$bin"
          python src/tests/api_contract_test.py "$bin"
          python src/tests/workflow_progress_test.py "$bin"
          python src/tests/utc_library_test.py
          python src/tests/utc_library_test.py "$bin" --report-dir "$RUNNER_TEMP/utc-native"
          python examples/adoption/order-quote/test_parity.py "$bin"
          python src/tests/ergonomics_test.py "$bin"
          python src/tests/embed_test.py "$bin"
          python src/tests/release_manifest_test.py
          python src/tests/project_doctor_test.py
          python src/tests/project_doctor_capabilities_test.py
          if [ "$RUNNER_OS" != "Windows" ]; then python src/tests/installer_publication_test.py InstallerDriver; fi
          python tools/fuzz.py "$bin" --iterations 200 --seed 20261010 --report "$RUNNER_TEMP/fuzz.json" --artifacts "$RUNNER_TEMP/fuzz-artifacts"
          SPROUT_COMMAND="$bin" python -m unittest discover -s integrations/python -p 'test_*.py'
          "$bin" test examples/apps/ui_test.sprout

      - name: Bounded workflow and HTTP workload regression
        run: |
          python tools/soak.py "$SPROUT_BINARY" --cycles 5 --report "$RUNNER_TEMP/soak.json"
          python tools/service_load.py "$SPROUT_BINARY" --contacts 100 --report "$RUNNER_TEMP/service-load.json"
          python src/tests/deployment_harness_test.py
          python src/tests/deployment_coverage_test.py
          python src/tests/service_recovery_test.py
          python tools/service_recovery.py "$SPROUT_BINARY" --workspace "$RUNNER_TEMP/service-recovery" --report "$RUNNER_TEMP/service-recovery.json" --label "$GITHUB_SHA"
          python tools/deployment_soak.py "$SPROUT_BINARY" --duration-seconds 8 --restart-seconds 3 --contention-seconds 3 --rate 4 --workspace "$RUNNER_TEMP/deployment-smoke" --report "$RUNNER_TEMP/deployment-smoke.json" --label ci-smoke

      - name: Windows installer publication boundaries
        if: runner.os == 'Windows'
        env:
          SPROUT_INSTALLER_ARTIFACTS: ${{ runner.temp }}/installer-boundary
        run: python src/tests/installer_publication_test.py -v

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Retain bounded workload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workload-failure-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/soak.json
            ${{ runner.temp }}/service-load.json
            ${{ runner.temp }}/deployment-smoke.json
            ${{ runner.temp }}/service-recovery.json
            ${{ runner.temp }}/service-recovery/
            ${{ runner.temp }}/installer-boundary/
            ${{ runner.temp }}/utc-native/
            soak-artifacts/
          if-no-files-found: ignore

      - name: Go SDK real-worker tests
        working-directory: integrations/go
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 ./...

      - name: Set up .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build native host library for .NET
        run: |
          mkdir -p native-host
          case "$RUNNER_OS" in
            Windows) gcc -std=c11 -O2 -shared -Wl,--export-all-symbols src/embed.c -o native-host/sprout_host.dll ;;
            macOS) cc -std=c11 -O2 -dynamiclib src/embed.c -o native-host/libsprout_host.dylib ;;
            Linux) cc -std=c11 -O2 -shared -fPIC src/embed.c -o native-host/libsprout_host.so ;;
          esac
          python - <<'PY'
          import os, sys
          from pathlib import Path
          name = 'sprout_host.dll' if os.name == 'nt' else 'libsprout_host.dylib' if sys.platform == 'darwin' else 'libsprout_host.so'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SPROUT_HOST_LIBRARY={(Path.cwd() / "native-host" / name).resolve()}\n')
          PY

      - name: .NET SDK real-worker tests
        working-directory: integrations/dotnet
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('global.json').write_text(json.dumps({'sdk': {'version': os.environ['DOTNET_SDK_VERSION'], 'rollForward': 'disable'}}), encoding='utf-8')
          PY
          dotnet --version
          dotnet run --project tests --configuration Release

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: integrations/java/pom.xml

      - name: Java SDK real-worker tests
        working-directory: integrations/java
        run: mvn --batch-mode --no-transfer-progress test

      - name: Standalone bundle round-trip
        shell: bash
        run: |
          bin=src/sprout; [ -f src/sprout.exe ] && bin=src/sprout.exe
          "$bin" bundle examples/fizzbuzz.sprout
          app=./fizzbuzz; [ -f fizzbuzz.exe ] && app=./fizzbuzz.exe
          out="$("$app")"
          printf '%s\n' "$out" | head -3
          printf '%s' "$out" | grep -q "Fizz" || { echo "FAIL: the bundled program did not run"; exit 1; }
          echo "bundle round-trip OK ($app ran with no interpreter)"

      - name: Code formatter (idempotent + behaviour-preserving)
        shell: bash
        run: |
          bin=src/sprout; [ -f src/sprout.exe ] && bin=src/sprout.exe
          for f in examples/*.sprout src/tests/*.sprout; do
            "$bin" format "$f" > /tmp/a; "$bin" format /tmp/a > /tmp/b
            diff -q /tmp/a /tmp/b >/dev/null || { echo "FAIL: sprout format is not idempotent on $f"; exit 1; }
          done
          "$bin" format src/tests/collections_power_test.sprout > /tmp/t.sprout
          "$bin" test /tmp/t.sprout
          echo "formatter OK: idempotent on all files + a formatted test still passes"

      - name: Package manager round-trip (add / use / install / remove)
        shell: bash
        run: |
          bin="$PWD/src/sprout"; [ -f "$PWD/src/sprout.exe" ] && bin="$PWD/src/sprout.exe"
          work="$(mktemp -d)"; cd "$work"
          printf 'public task square(n):\n    give n * n\n' > mathx.sprout
          printf 'use mathx\nshow mathx.square(6)\n' > app.sprout
          "$bin" add ./mathx.sprout
          out="$("$bin" app.sprout)"; echo "use -> $out"
          [ "$out" = "36" ] || { echo "FAIL: use of the added package"; exit 1; }
          rm -rf sprout_packages                       # simulate a fresh clone with only the manifest
          "$bin" install
          out="$("$bin" app.sprout)"
          [ "$out" = "36" ] || { echo "FAIL: install did not restore the package"; exit 1; }
          "$bin" remove mathx
          grep -q '^mathx ' sprout.packages && { echo "FAIL: remove left a manifest entry"; exit 1; }
          echo "package manager OK: add, use, install-restore, remove"

  paper:
    name: Paper adapter (Java 25, native worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build native interpreter
        run: |
          cc -O2 -Wall -DSPROUT_SQLITE -o src/sprout src/sprout.c src/vendor/sqlite/sqlite3.c -lm -pthread -ldl
          printf 'SPROUT_BINARY=%s/src/sprout\nSPROUT_COMMAND=%s/src/sprout\n' "$PWD" "$PWD" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            integrations/java/pom.xml
            integrations/paper/pom.xml

      - name: Install Java SDK
        working-directory: integrations/java
        run: mvn --batch-mode --no-transfer-progress test install

      - name: Compile and test Paper adapter
        working-directory: integrations/paper
        run: mvn --batch-mode --no-transfer-progress test package

      - name: Packaged Paper JAR native smoke
        working-directory: integrations/paper
        run: java -cp 'target/sprout-paper-0.1.0.jar:target/test-classes' io.sprout.paper.PackagedJarSmoke "$SPROUT_BINARY" src/main/resources/rules.sprout

  asan:
    name: memory safety (AddressSanitizer, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build with AddressSanitizer
        run: cc -O1 -g -DSPROUT_SQLITE -fsanitize=address -fno-omit-frame-pointer -o src/sprout src/sprout.c src/vendor/sqlite/sqlite3.c -lm -pthread -ldl

      # Leak detection is off because parser/CLI state lives until process exit.
      # Guard collected runtime values against use-after-free, overflows, and bad frees.
      # detect_stack_use_after_return=0 keeps locals on the REAL C stack. ASan's default
      # "fake stack" relocates them to the heap, where the GC's conservative stack scan
      # can't see them — incompatible with conservative collection (Boehm documents the
      # same). Heap use-after-free / overflow detection (what matters) stays on.
      - name: Run the suite + examples under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0:halt_on_error=1:abort_on_error=1
        run: bash src/tests/run.sh

      # The strongest GC check: collect on EVERY statement (so any missing root frees a
      # live object) WHILE AddressSanitizer watches for the resulting use-after-free.
      - name: Run the suite under GC stress + ASan
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0:halt_on_error=1:abort_on_error=1
          SPROUT_GC_STRESS: "1"
          SPROUT_GC_ROOT_CC: cc
          SPROUT_GC_ROOT_CFLAGS: -O1 -g -fsanitize=address -fno-omit-frame-pointer
          SPROUT_ARGUMENT_BUFFER_CC: cc
          SPROUT_ARGUMENT_BUFFER_CFLAGS: -O1 -g -fsanitize=address -fno-omit-frame-pointer
          SPROUT_CAPABILITIES_CC: cc
          SPROUT_CAPABILITIES_CFLAGS: -O1 -g -fsanitize=address -fno-omit-frame-pointer
        run: |
          bash src/tests/run.sh
          python src/tests/gc_env_roots_test.py "$PWD/src/sprout"
          python src/tests/argument_buffers_test.py "$PWD/src/sprout"
          python src/tests/runtime_capabilities_test.py "$PWD/src/sprout"
          python src/tests/runtime_production_test.py "$PWD/src/sprout"
          python src/tests/ergonomics_test.py "$PWD/src/sprout"
          python src/tests/security_boundary_test.py "$PWD/src/sprout"
          python src/tests/unicode_boundary_test.py "$PWD/src/sprout"
          python src/tests/serialization_test.py "$PWD/src/sprout"
          python src/tests/store_publication_test.py "$PWD/src/sprout"
          python src/tests/sqlite_migrations_test.py "$PWD/src/sprout"
          python src/tests/workflow_tools_test.py "$PWD/src/sprout"
          python src/tests/cli_library_test.py "$PWD/src/sprout"
          # The full boundary suite uses ASan with ordinary collection; the
          # small shared corpus additionally collects after every statement.
          env -u SPROUT_GC_STRESS python src/tests/validation_library_test.py "$PWD/src/sprout"
          env -u SPROUT_GC_STRESS python src/tests/intrinsic_builtin_test.py "$PWD/src/sprout"
          env -u SPROUT_GC_STRESS python src/tests/csv_import_example_test.py "$PWD/src/sprout"
          env -u SPROUT_GC_STRESS python src/tests/config_library_test.py "$PWD/src/sprout"
          env -u SPROUT_GC_STRESS python src/tests/api_contract_test.py "$PWD/src/sprout"
          env -u SPROUT_GC_STRESS python src/tests/workflow_progress_test.py "$PWD/src/sprout"
          env -u SPROUT_GC_STRESS python src/tests/utc_library_test.py "$PWD/src/sprout" --report-dir "$RUNNER_TEMP/utc-asan"
          env -u SPROUT_GC_STRESS python examples/adoption/order-quote/test_parity.py "$PWD/src/sprout"
          "$PWD/src/sprout" test src/tests/validation_library_test.sprout --max-steps 3000000 --timeout-ms 5000
          "$PWD/src/sprout" test src/tests/intrinsic_builtin_test.sprout --max-steps 3000000 --timeout-ms 5000
          "$PWD/src/sprout" test src/tests/config_library_test.sprout --max-steps 3000000 --timeout-ms 5000
          "$PWD/src/sprout" test src/tests/api_contract_test.sprout --max-steps 5000000 --timeout-ms 5000
          "$PWD/src/sprout" test src/tests/workflow_progress_test.sprout --max-steps 1000000 --timeout-ms 3000
          python tools/fuzz.py "$PWD/src/sprout" --iterations 100 --seed 20261010 --report "$RUNNER_TEMP/fuzz-asan.json" --artifacts "$RUNNER_TEMP/fuzz-asan-artifacts"

      - name: Retain bounded UTC failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: utc-failure-asan
          path: ${{ runner.temp }}/utc-asan/
          if-no-files-found: ignore

  ubsan:
    name: numeric and boundary safety (UndefinedBehaviorSanitizer, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build with checked undefined arithmetic and floating conversions
        run: cc -O1 -g -DSPROUT_SQLITE -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer -o src/sprout src/sprout.c src/vendor/sqlite/sqlite3.c -lm -pthread -ldl
      - name: Adversarial JSON, numeric, package, and bundle boundaries
        env:
          SPROUT_GC_ROOT_CC: cc
          SPROUT_GC_ROOT_CFLAGS: -O1 -g -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
          SPROUT_ARGUMENT_BUFFER_CC: cc
          SPROUT_ARGUMENT_BUFFER_CFLAGS: -O1 -g -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
          SPROUT_CAPABILITIES_CC: cc
          SPROUT_CAPABILITIES_CFLAGS: -O1 -g -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
        run: |
          python src/tests/gc_env_roots_test.py "$PWD/src/sprout"
          python src/tests/argument_buffers_test.py "$PWD/src/sprout"
          python src/tests/runtime_capabilities_test.py "$PWD/src/sprout"
          python src/tests/security_boundary_test.py "$PWD/src/sprout"
          python src/tests/serialization_test.py "$PWD/src/sprout"
          python src/tests/store_publication_test.py "$PWD/src/sprout"
          python src/tests/sqlite_migrations_test.py "$PWD/src/sprout"
          python src/tests/workflow_tools_test.py "$PWD/src/sprout"
          python src/tests/cli_library_test.py "$PWD/src/sprout"
          python src/tests/validation_library_test.py "$PWD/src/sprout"
          python src/tests/intrinsic_builtin_test.py "$PWD/src/sprout"
          python src/tests/csv_import_example_test.py "$PWD/src/sprout"
          python src/tests/config_library_test.py "$PWD/src/sprout"
          python src/tests/api_contract_test.py "$PWD/src/sprout"
          python src/tests/workflow_progress_test.py "$PWD/src/sprout"
          python src/tests/utc_library_test.py "$PWD/src/sprout" --report-dir "$RUNNER_TEMP/utc-ubsan"
          python examples/adoption/order-quote/test_parity.py "$PWD/src/sprout"

      - name: Retain bounded UTC failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: utc-failure-ubsan
          path: ${{ runner.temp }}/utc-ubsan/
          if-no-files-found: ignore

  playground:
    name: playground image (Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build the playground image
        run: docker build -f playground/Dockerfile -t sprout-playground .

      - name: Smoke test — safe code runs, dangerous code is blocked
        run: |
          run() { docker run --rm -i --network none --memory 256m --pids-limit 64 \
            --read-only --tmpfs /tmp:size=16m --cap-drop ALL --security-opt no-new-privileges sprout-playground; }
          out="$(echo 'show 2 + 2' | run)"
          echo "safe -> $out"; [ "$out" = "4" ] || { echo "FAIL: safe code did not return 4"; exit 1; }
          for op in 'read("/etc/passwd")' 'write("/x","y")' 'get("http://169.254.169.254/")'; do
            blk="$(printf 'show %s\n' "$op" | run)"
            echo "$op -> $(printf '%s' "$blk" | tr -d '\n' | head -c 80)"
            printf '%s' "$blk" | grep -qi "sandbox mode" || { echo "FAIL: $op was NOT blocked"; exit 1; }
          done
          echo "playground image OK: safe code runs, file/shell/network blocked"

      - name: docker-compose.yml is valid
        run: docker compose config --quiet && echo "compose config OK"

      - name: Shipped Compose deployment — serve, run, block, no temp-file leak
        # Exercise the actual checkout build, loopback publication and shipped limits.
        run: |
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up --build -d
          cid="$(docker compose ps -q sprout-playground)"
          [ -n "$cid" ] || { echo "FAIL: Compose did not start the playground"; exit 1; }
          [ "$(docker inspect --format '{{(index (index .HostConfig.PortBindings "8080/tcp") 0).HostIp}}' "$cid")" = "127.0.0.1" ] || { echo "FAIL: playground publication is not loopback"; exit 1; }
          for i in $(seq 1 30); do
            s="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)"
            [ "$s" = "healthy" ] && break; sleep 2
          done
          [ "$s" = "healthy" ] || { echo "FAIL: web image never became healthy"; docker logs "$cid"; exit 1; }
          api() { curl -s -X POST --data-binary "$1" http://localhost:8080/run; }
          safe="$(api 'show 6 * 7')"
          echo "safe -> $safe"; printf '%s' "$safe" | grep -q '"output": "42' || { echo "FAIL: web safe run"; exit 1; }
          blk="$(api 'show read("/etc/passwd")')"
          printf '%s' "$blk" | grep -qi "sandbox mode" || { echo "FAIL: web read not blocked"; exit 1; }
          # a big output flood must be capped (not error out) and must not leak temp files
          flood="$(printf 'repeat 200000 times:\n    show "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"\n')"
          for n in $(seq 1 6); do api "$flood" > /dev/null; done
          left="$(docker exec "$cid" sh -c 'ls -1 /tmp | wc -l')"
          echo "temp files in /tmp after 6 floods: $left"
          [ "$left" -eq 0 ] || { echo "FAIL: web playground leaked temp files"; exit 1; }
          still="$(api 'show 1 + 1')"
          printf '%s' "$still" | grep -q '"output": "2' || { echo "FAIL: web server broken after floods"; exit 1; }
          echo "web playground OK: serves, sandboxes, caps output, cleans up temp files"
