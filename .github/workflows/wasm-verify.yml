name: WebAssembly verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Compile the current source and test the actual interpreter
        run: |
          mkdir -p wasm-verification
          emcc src/sprout.c -O2 -o wasm-verification/sprout.js \
            -sMODULARIZE=1 -sEXPORT_NAME=createSprout \
            -sINVOKE_RUN=0 -sEXIT_RUNTIME=1 \
            -sEXPORTED_RUNTIME_METHODS=callMain,FS \
            -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=4mb \
            -sSUPPORT_LONGJMP=1 -lm
          node playground/tests/wasm-smoke.js "$PWD/wasm-verification/sprout.js"
