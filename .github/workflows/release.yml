name: Release

# A version tag must match the compiled interpreter version exactly.
# This builds Sprout on Linux, macOS and Windows, runs the test suite on each, and publishes a
# GitHub Release with all three binaries attached (plus auto-generated notes).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: sprout-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Full native, SDK, sanitizer and container verification
    uses: ./.github/workflows/ci.yml

  wasm-verification:
    name: Actual WebAssembly verification
    uses: ./.github/workflows/wasm-verify.yml

  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: sprout-linux-x86_64 }
          - { os: macos-latest,   asset: sprout-macos-arm64 }
          - { os: windows-latest, asset: sprout-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Build, smoke-test, and run the suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gcc -O2 -Wall -s -DSPROUT_SQLITE -Wl,--stack,67108864 -o "${{ matrix.asset }}" src/sprout.c src/vendor/sqlite/sqlite3.c -lm -lurlmon
            cp "${{ matrix.asset }}" src/sprout.exe
          else
            cc -O2 -Wall -DSPROUT_SQLITE -o "${{ matrix.asset }}" src/sprout.c src/vendor/sqlite/sqlite3.c -lm -pthread -ldl
            cp "${{ matrix.asset }}" src/sprout
          fi
          "./${{ matrix.asset }}" version
          python - <<'PY'
          import os
          from pathlib import Path
          binary = (Path.cwd() / '${{ matrix.asset }}').resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SPROUT_BINARY={binary}\nSPROUT_COMMAND={binary}\n')
          PY
          bash src/tests/run.sh          # never ship a binary that fails its tests
          bin="$(python -c 'import os; from pathlib import Path; print((Path.cwd() / "${{ matrix.asset }}").resolve())')"
          export SPROUT_BINARY="$bin" SPROUT_COMMAND="$bin"
          compiler=cc; if [ "$RUNNER_OS" = "Windows" ]; then compiler=gcc; fi
          export SPROUT_GC_ROOT_CC="$compiler"
          python src/tests/gc_env_roots_test.py "$bin"
          python src/tests/cli_test.py "$bin"
          python src/tests/unicode_boundary_test.py "$bin"
          python src/tests/stdlib_production_test.py "$bin"
          python src/tests/distribution_test.py "$bin"
          python src/tests/security_boundary_test.py "$bin"
          python src/tests/serialization_test.py "$bin"
          python src/tests/store_publication_test.py "$bin"
          python src/tests/store_read_fault_test.py
          python src/tests/runtime_production_test.py "$bin"
          python src/tests/sqlite_migrations_test.py "$bin"
          python src/tests/workflow_tools_test.py "$bin"
          python src/tests/cli_library_test.py "$bin"
          python src/tests/validation_library_test.py "$bin"
          python src/tests/intrinsic_builtin_test.py "$bin"
          python src/tests/csv_import_example_test.py "$bin"
          python src/tests/config_library_test.py "$bin"
          python src/tests/api_contract_test.py "$bin"
          python src/tests/workflow_progress_test.py "$bin"
          python examples/adoption/order-quote/test_parity.py "$bin"
          python src/tests/ergonomics_test.py "$bin"
          python src/tests/embed_test.py "$bin"
          python src/tests/release_manifest_test.py
          python src/tests/project_doctor_test.py
          if [ "$RUNNER_OS" != "Windows" ]; then python src/tests/installer_publication_test.py InstallerDriver; fi
          python src/tests/deployment_harness_test.py
          python src/tests/deployment_coverage_test.py
          python src/tests/service_recovery_test.py
          node --test integrations/node/tests/*.test.js
          node --test examples/adoption/order-quote/parity.test.js
          python tools/soak.py "$bin" --cycles 5 --report "$RUNNER_TEMP/release-soak.json"
          python tools/service_load.py "$bin" --contacts 100 --report "$RUNNER_TEMP/release-service-load.json"
          python tools/service_recovery.py "$bin" --workspace "$RUNNER_TEMP/release-service-recovery" --report "$RUNNER_TEMP/release-service-recovery.json" --label "$GITHUB_SHA"
          python tools/deployment_soak.py "$bin" --duration-seconds 8 --restart-seconds 3 --contention-seconds 3 --rate 4 --workspace "$RUNNER_TEMP/release-deployment-smoke" --report "$RUNNER_TEMP/release-deployment-smoke.json" --label release-smoke
          SPROUT_COMMAND="$bin" python -m unittest discover -s integrations/python -p 'test_*.py'

      - name: Windows installer publication boundaries
        if: runner.os == 'Windows'
        shell: bash
        env:
          SPROUT_INSTALLER_ARTIFACTS: ${{ runner.temp }}/installer-boundary
        run: python src/tests/installer_publication_test.py -v

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: installer\build.cmd

      - name: Record tested native assets and enforce matching version
        shell: bash
        run: |
          compiler=cc; if [ "$RUNNER_OS" = "Windows" ]; then compiler=gcc; fi
          args=(platform "${{ matrix.asset }}" --platform "$RUNNER_OS" --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --compiler "$compiler")
          if [ "$RUNNER_OS" = "Windows" ]; then args+=(--installer installer/sprout-installer.exe); fi
          python tools/release_manifest.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.manifest.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: sprout-installer
          path: installer/sprout-installer.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, verification, wasm-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: write                    # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate all platform assets before publishing
        id: metadata
        run: |
          python tools/release_manifest.py assemble dist --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA"
          python - <<'PY'
          import os
          prerelease = '-' in os.environ['GITHUB_REF_NAME'].split('+', 1)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prerelease={str(prerelease).lower()}\n')
          PY

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.metadata.outputs.prerelease == 'true' && 'false' || 'legacy' }}
