# Standalone example. Supply certificates and a password file outside the repo.
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 512; }
http {
    log_format sprout '$remote_addr $request_method $status $body_bytes_sent $request_time $upstream_status $upstream_response_time';
    access_log /var/log/nginx/sprout-access.log sprout;
    error_log /var/log/nginx/sprout-error.log warn;
    limit_req_zone $binary_remote_addr zone=sprout_requests:1m rate=10r/s;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name sprout.example.invalid;
        ssl_certificate /etc/sprout/tls/server.pem;
        ssl_certificate_key /etc/sprout/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "Sprout private service";
        auth_basic_user_file /etc/sprout/service.htpasswd;
        client_max_body_size 64k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        send_timeout 10s;
        limit_req zone=sprout_requests burst=16 nodelay;
        limit_req_status 429;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.0;
            proxy_set_header Connection close;
            proxy_set_header Authorization "";
            proxy_set_header Host sprout-private-worker;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 8s;
            proxy_next_upstream off;
            proxy_max_temp_file_size 0;
        }
    }
}
